<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>湛江生产订单管理系统</title>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script>
if(typeof XLSX==='undefined'){ // 备用 CDN
  document.write('<script src="https://unpkg.com/xlsx@0.18.5/dist/xlsx.full.min.js"><\/script>');
}
</script>
<style>
:root{
  --bg:#f4f6f9; --card:#fff; --line:#e3e8ef; --text:#1f2937; --muted:#6b7280;
  --pri:#1d4ed8; --pri-l:#eff4ff; --ok:#15803d; --ok-l:#eafaf0;
  --warn:#b45309; --warn-l:#fff8eb; --err:#b91c1c; --err-l:#fef2f2;
  --gray-l:#f3f4f6;
}
*{box-sizing:border-box}
body{margin:0;font-family:"Microsoft YaHei","PingFang SC","WenQuanYi Micro Hei",system-ui,sans-serif;
  background:var(--bg);color:var(--text);font-size:13px}
header{background:linear-gradient(90deg,#0f172a,#1e3a8a);color:#fff;padding:10px 18px;
  display:flex;align-items:center;gap:14px;flex-wrap:wrap;position:sticky;top:0;z-index:50}
header h1{font-size:16px;margin:0;font-weight:600;letter-spacing:.5px}
header .sp{flex:1}
button{font-family:inherit;font-size:12px;border-radius:6px;border:1px solid var(--line);
  background:#fff;color:var(--text);padding:7px 12px;cursor:pointer;transition:.15s}
button:hover{border-color:var(--pri);color:var(--pri)}
button.pri{background:var(--pri);border-color:var(--pri);color:#fff}
button.pri:hover{background:#1e40af;color:#fff}
button.ok{background:var(--ok);border-color:var(--ok);color:#fff}
button.ok:hover{background:#166534;color:#fff}
button.sm{padding:4px 9px;font-size:11px}
button.danger{color:var(--err);border-color:#fecaca}
button.danger:hover{background:var(--err-l);border-color:var(--err);color:var(--err)}
nav{display:flex;gap:2px;background:#fff;border-bottom:1px solid var(--line);padding:0 14px;
  position:sticky;top:46px;z-index:49;overflow-x:auto}
nav button{border:none;background:none;border-radius:0;padding:11px 16px;font-size:13px;
  color:var(--muted);border-bottom:2px solid transparent}
nav button:hover{color:var(--pri);background:none}
nav button.on{color:var(--pri);border-bottom-color:var(--pri);font-weight:600}
main{padding:16px}
.page{display:none}.page.on{display:block}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-bottom:14px}
.card h2{font-size:14px;margin:0 0 12px;display:flex;align-items:center;gap:8px}
.card h2 .tag{font-size:11px;font-weight:400;color:var(--muted);background:var(--gray-l);
  padding:2px 8px;border-radius:10px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
label{color:var(--muted);font-size:12px}
input,select,textarea{font-family:inherit;font-size:12px;padding:6px 9px;border:1px solid var(--line);
  border-radius:6px;background:#fff;color:var(--text);outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--pri)}
input[type=date]{min-width:132px}
table{width:100%;border-collapse:collapse;font-size:12px}
th,td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
th{background:var(--gray-l);color:var(--muted);font-weight:600;position:sticky;top:0;z-index:2}
tbody tr:hover{background:var(--pri-l)}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
.tw{max-height:64vh;overflow:auto;border:1px solid var(--line);border-radius:8px}
.kpi{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:14px}
.kpi div{background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.kpi b{display:block;font-size:22px;font-weight:700;line-height:1.3}
.kpi span{color:var(--muted);font-size:12px}
.badge{display:inline-block;padding:2px 8px;border-radius:10px;font-size:11px;line-height:18px}
.b-ok{background:var(--ok-l);color:var(--ok)}.b-warn{background:var(--warn-l);color:var(--warn)}
.b-err{background:var(--err-l);color:var(--err)}.b-gray{background:var(--gray-l);color:var(--muted)}
.b-pri{background:var(--pri-l);color:var(--pri)}
.bar{height:8px;background:var(--gray-l);border-radius:5px;overflow:hidden;min-width:70px}
.bar i{display:block;height:100%;background:var(--pri)}
.bar.ok i{background:var(--ok)}.bar.err i{background:var(--err)}
.mask{position:fixed;inset:0;background:rgba(15,23,42,.5);display:none;align-items:center;
  justify-content:center;z-index:100;padding:20px}
.mask.on{display:flex}
.modal{background:#fff;border-radius:12px;width:min(720px,100%);max-height:86vh;overflow:auto;padding:20px}
.modal h3{margin:0 0 14px;font-size:15px}
.modal .foot{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}
pre.tip{background:var(--gray-l);border-radius:8px;padding:12px;overflow:auto;font-size:11.5px;
  line-height:1.7;margin:6px 0;color:#374151}
.msg{position:fixed;left:50%;top:60px;transform:translateX(-50%);z-index:200;display:flex;
  flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.msg div{background:#0f172a;color:#fff;padding:9px 18px;border-radius:20px;font-size:12.5px;
  box-shadow:0 6px 20px rgba(0,0,0,.2);animation:fade 3s forwards}
.msg div.err{background:var(--err)}.msg div.ok{background:var(--ok)}
@keyframes fade{0%{opacity:0;transform:translateY(-8px)}10%,80%{opacity:1;transform:none}100%{opacity:0}}
.cell-in{width:78px;padding:3px 6px;text-align:right;border:1px solid transparent;background:transparent}
.delx{background:transparent;border:none;color:var(--muted);cursor:pointer;font-size:13px;
  padding:0 3px;margin-left:3px;line-height:1;vertical-align:middle;border-radius:3px}
.delx:hover{color:var(--err);background:#fee2e2}
.cell-in:hover{border-color:var(--line);background:#fff}
.empty{padding:40px;text-align:center;color:var(--muted)}
.hint{color:var(--muted);font-size:11.5px;line-height:1.7}
.fl{display:flex;gap:6px;flex-wrap:wrap}
.seg{display:flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{border:none;border-radius:0;padding:6px 12px}
.seg button.on{background:var(--pri);color:#fff}
.drag{border:2px dashed #c7d2fe;border-radius:10px;padding:22px;text-align:center;color:var(--muted);
  background:var(--pri-l);cursor:pointer}
.drag:hover{border-color:var(--pri);color:var(--pri)}
tr.grp{background:#eef2f7;font-weight:600}
footer{text-align:center;color:var(--muted);font-size:12px;padding:14px 10px 22px;
  border-top:1px solid var(--line);margin-top:16px;display:flex;gap:16px;justify-content:center;flex-wrap:wrap}
footer #footVer{cursor:pointer;color:var(--pri)}
footer #footVer:hover{text-decoration:underline}

/* ===== 手机适配 ===== */
@media (max-width:768px){
  header{flex-wrap:wrap;gap:6px;padding:8px 10px;position:static}
  header h1{font-size:15px;width:100%;margin-bottom:2px}
  header button{padding:5px 9px;font-size:12px}
  header .sp{display:none}
  nav{position:static;overflow-x:auto;white-space:nowrap;-webkit-overflow-scrolling:touch}
  nav button{padding:9px 12px;font-size:12px}
  main{padding:8px}
  .kpi{grid-template-columns:repeat(2,1fr);gap:6px}
  .kpi div{padding:8px 6px}
  .kpi b{font-size:18px}
  .kpi span{font-size:11px}
  .card{padding:10px}
  .card h2{font-size:14px;flex-wrap:wrap;gap:4px}
  .row{flex-wrap:wrap;gap:6px}
  .row>label{width:auto!important;min-width:52px;font-size:12px}
  input[type=text],input:not([type]),select,input[type=date],input[type=number]{
    font-size:16px!important;  /* 防止 iOS 自动放大 */
    max-width:100%!important; width:auto!important; min-width:110px;
  }
  .tw{overflow-x:auto;-webkit-overflow-scrolling:touch}
  table{font-size:12px;min-width:auto}
  th,td{padding:5px 6px;white-space:nowrap}
  .modal{width:96vw;max-height:88vh;padding:12px}
  .modal h3{font-size:15px}
  .modal .tw{max-height:50vh;overflow:auto}
  footer{font-size:11px;flex-direction:column;gap:4px;padding:10px}
  .cell-in{width:56px;font-size:13px}
  .badge{font-size:11px;padding:2px 6px}
  .tag{font-size:11px}
  .hint{font-size:11px}
  /* 手机上把操作按钮放大，方便点 */
  button.sm{padding:6px 10px;font-size:12px}
}
@media (max-width:420px){
  .kpi{grid-template-columns:repeat(2,1fr)}
  .kpi b{font-size:16px}
  header button{padding:4px 7px;font-size:11px}
}
details summary{cursor:pointer;color:var(--pri);font-size:12px;padding:4px 0}
</style>
</head>
<body>
<header>
  <h1>🏭 湛江生产订单管理系统</h1>
  <span class="sp"></span>
  <button id="btnImp" onclick="openImport()">📥 导入周计划 / 订单</button>
  <button id="btnBak" onclick="exportJSON()" title="导出完整数据备份（仅超级管理员）">💾 备份数据</button>
  <button id="btnUser" onclick="openLogin()">🔑 登录</button>
  <button id="btnSync" onclick="syncNow()" title="立即与云端同步（浏览模式只拉取，不上传）">☁️ 同步</button>
  <button id="btnSet" onclick="openSet()">⚙️ 设置</button>
</header>
<nav id="nav"></nav>
<main>
  <section class="page" id="p-dash"></section>
  <section class="page" id="p-order"></section>
  <section class="page" id="p-done"></section>
  <section class="page" id="p-stat"></section>
  <section class="page" id="p-prod"></section>
  <section class="page" id="p-mat"></section>
  <section class="page" id="p-bal"></section>
  <section class="page" id="p-hold"></section>
  <section class="page" id="p-mob"></section>
</main>

<footer id="foot">
  <span id="footVer" onclick="openVer()" title="点击查看版本管理">🏷️ <b>v1.0</b></span>
  <span id="footInfo"></span>
</footer>

<div class="mask" id="mask"><div class="modal" id="modal"></div></div>
<div class="msg" id="msg"></div>
<input type="file" id="file" accept=".xlsx,.xls,.csv" style="display:none">

<script>
/* ============ 基础工具 ============ */
/* 工段 → 工序（可编辑配置，支持自定义增删，存于 S.meta.steps） */
const DEF_STEPS = {
  '焊接': ['焊接','灌胶','模组','配件/整机组装','维修'],
  '组装': ['空舱','空舱打压','实舱','实舱打压','配件/整机组装','配件/整机打压','姿态1','老化','姿态2','烘烤','维修'],
  '包装': ['待包装','包装','配件/整机组装','实舱打压','姿态1','维修']
};
/* 当前生效的工序配置：优先读用户自定义 */
function CFG(){ return (S.meta && S.meta.steps && Object.keys(S.meta.steps).length) ? S.meta.steps : DEF_STEPS; }
function STEPS(){ return CFG(); }
/* 全工序（去重，按工艺路线排序）—— 用于导出表头等，避免跨工段同名工序出现重复列 */
const allSteps = () => {
  const set=new Set(); Object.values(CFG()).forEach(a=>(a||[]).forEach(x=>set.add(x)));
  const arr=[...set];
  arr.sort((a,b)=>{ const ia=FULL_ORDER.indexOf(a), ib=FULL_ORDER.indexOf(b);
    if(ia>=0&&ib>=0) return ia-ib; if(ia>=0) return -1; if(ib>=0) return 1; return 0; });
  return arr;
};
const stepsOf = sec => CFG()[sec] || [];
/* 增删工序 */
/* 恢复被隐藏的工序（重新显示） */
function unhideStep(sec,st){
  if(!canCfg()){ toast('仅超级管理员可操作','err'); return; }
  const h=(S.meta.hideSteps||{})[sec]||[];
  S.meta.hideSteps[sec]=h.filter(x=>x!==st);
  // 如果配置里没有，就加回配置末尾
  const cfg=JSON.parse(JSON.stringify(CFG()));
  cfg[sec]=cfg[sec]||[];
  if(cfg[sec].indexOf(st)<0) cfg[sec].push(st);
  S.meta.steps=cfg; save(); render();
  if($('#modal').innerHTML.includes('工序管理')) openStepCfg();
  toast('已恢复显示「'+sec+'·'+st+'」','ok');
}
/* 清空某工段的隐藏名单 */
function unhideAll(sec){
  if(!canCfg()){ toast('仅超级管理员可操作','err'); return; }
  const h=(S.meta.hideSteps||{})[sec]||[];
  if(!h.length){ toast('该工段没有隐藏的工序'); return; }
  if(!confirm('恢复【'+sec+'】全部隐藏工序：'+h.join('、'))) return;
  S.meta.hideSteps[sec]=[];
  const cfg=JSON.parse(JSON.stringify(CFG()));
  cfg[sec]=cfg[sec]||[];
  h.forEach(x=>{ if(cfg[sec].indexOf(x)<0) cfg[sec].push(x); });
  S.meta.steps=cfg; save(); render();
  if($('#modal').innerHTML.includes('工序管理')) openStepCfg();
  toast('已恢复 '+h.length+' 个工序','ok');
}
/* 一键隐藏：把「订单数据里有、但不在工序配置里」的工序全部隐藏。
   典型场景：导入旧数据后，表里冒出不属于本工段的列（如组装工段出现"包装"）。 */
function hideExtraSteps(){
  if(!canCfg()){ toast('仅超级管理员可操作','err'); return; }
  const cfg=CFG();
  const found={};   // sec -> [多余的工序]
  S.orders.forEach(o=>{
    const sec=o.section||'其他';
    const base=cfg[sec]||[];
    Object.keys(o.steps||{}).forEach(st=>{
      if(base.indexOf(st)<0 && !isHidden(sec,st)){
        (found[sec]=found[sec]||[]);
        if(found[sec].indexOf(st)<0) found[sec].push(st);
      }
    });
  });
  const keys=Object.keys(found);
  if(!keys.length){ toast('没有多余的动态列，各工段显示的都是你配置的工序','ok'); return; }
  const desc=keys.map(k=>'【'+k+'】'+found[k].join('、')).join('；');
  if(!confirm('将隐藏以下不属于各工段配置的工序：\n\n'+desc
    +'\n\n（数据不会删除，只是不显示；可在工序管理里点 ↺ 恢复）\n\n确定？')) return;
  S.meta.hideSteps=S.meta.hideSteps||{};
  keys.forEach(k=>{
    S.meta.hideSteps[k]=(S.meta.hideSteps[k]||[]).concat(found[k]);
  });
  save(); render();
  toast('已隐藏 '+keys.reduce((n,k)=>n+found[k].length,0)+' 个多余工序','ok');
}
function addStepTo(sec){
  if(!canCfg()){ toast('仅超级管理员可调整工序','err'); return; }
  const name=(prompt('给【'+sec+'】新增一道工序，请输入名称：','')||'').trim();
  if(!name) return;
  const cfg=JSON.parse(JSON.stringify(CFG()));
  cfg[sec]=cfg[sec]||[];
  if(cfg[sec].includes(name)){ toast('已存在该工序','err'); return; }
  cfg[sec].push(name);
  if(FULL_ORDER.indexOf(name)<0) FULL_ORDER.push(name);
  S.meta.steps=cfg; save(); render();
  if($('#modal').innerHTML.includes('工序管理')) openStepCfg();
  toast('已新增工序「'+name+'」','ok');
}
function delStepFrom(sec,st){
  if(!canCfg()){ toast('仅超级管理员可调整工序','err'); return; }
  const inUse=S.orders.filter(o=>o.section===sec&&num(o.steps?.[st])>0);
  const warn=inUse.length?('\n该工序下有 '+inUse.length+' 张订单填了数量，删除后不再显示（数据仍保留在备份中）。'):'';
  if(!confirm('确定删除【'+sec+'】的工序「'+st+'」？'+warn)) return;
  const cfg=JSON.parse(JSON.stringify(CFG()));
  cfg[sec]=(cfg[sec]||[]).filter(x=>x!==st);
  S.meta.steps=cfg;
  save(); render();
  if($('#modal').innerHTML.includes('工序管理')) openStepCfg();
  toast('已删除工序「'+st+'」','ok');
}
function addSection(){
  if(!canCfg()){ toast('仅超级管理员可调整工序','err'); return; }
  const name=(prompt('新增工段名称（如：测试、老化房）：','')||'').trim();
  if(!name) return;
  const cfg=JSON.parse(JSON.stringify(CFG()));
  if(cfg[name]){ toast('已存在该工段','err'); return; }
  cfg[name]=[];
  S.meta.steps=cfg; save(); render();
  if($('#modal').innerHTML.includes('工序管理')) openStepCfg();
  toast('已新增工段「'+name+'」，可点「+ 工序」添加工序','ok');
}
function delSection(sec){
  if(!canCfg()){ toast('仅超级管理员可调整工序','err'); return; }
  const n=S.orders.filter(o=>o.section===sec).length;
  if(n&&!confirm('【'+sec+'】下还有 '+n+' 张订单，删除工段后这些订单将归入「其他」。\n确定删除？')) return;
  const cfg=JSON.parse(JSON.stringify(CFG()));
  delete cfg[sec];
  S.meta.steps=cfg; save(); render();
  if($('#modal').innerHTML.includes('工序管理')) openStepCfg();
  toast('已删除工段「'+sec+'」','ok');
}
function resetSteps(){
  if(!canCfg()){ toast('仅超级管理员可调整工序','err'); return; }
  if(!confirm('恢复默认工序配置？\n你自定义的增删将丢失（已填数量不会丢）。')) return;
  delete S.meta.steps; save(); render(); toast('已恢复默认工序配置','ok');
}
/* 全部可能工序的固定顺序（用于动态补列、统计排序） */
const FULL_ORDER = ['焊接','灌胶','模组','空舱','空舱打压','实舱','实舱打压',
  '配件/整机组装','配件/整机打压','姿态1','老化','姿态2','烘烤','待包装','包装','维修'];
/* ===== 工序流转（存量口径）=====
   开启后：在某道工序填入 n，表示这 n 件「流到了」该工序，
   系统自动从它前面的各道工序里扣掉 n（扣到 0 为止）。
   关闭时（默认）：各道工序填的是累计经过量，互不相干。 */
/* 流转口径默认开启；仅超管在设置里显式关闭后才是 false（老数据无该字段也按开启） */
function flowOn(){ return (S.meta && S.meta.flowMode===false) ? false : true; }
/* 返回被扣减的说明数组；st 之前的工序按 FULL_ORDER 顺序判定先后 */
/* 扣减模式：near=就近消耗（默认，保证总量守恒）；all=扣减前面所有工序；off=不自动扣 */
function deductMode(){ return (S.meta && S.meta.flowDeduct) || 'near'; }
function flowDeduct(o, st, v){
  if(!flowOn() || !(v>0)) return [];
  if(deductMode()==='off') return [];
  const oi=FULL_ORDER.indexOf(st);
  if(oi<0) return [];                    // 未知工序不参与流转
  o.steps=o.steps||{};
  const chg=[];
  if(deductMode()==='all'){
    // 旧行为：前面所有工序一律扣减（会破坏总量守恒，仅特殊场景用）
    FULL_ORDER.slice(0,oi).forEach(x=>{
      const cur=num(o.steps[x]);
      if(cur>0){ const nv=Math.max(0,cur-v); if(nv!==cur){ o.steps[x]=nv; chg.push(x+' '+cur+'→'+nv); } }
    });
    return chg;
  }
  // near：只从「最近的上游」消耗，扣够了就停 —— 总量守恒，且不会误扣其它未动的工序
  let remain=v;
  for(let i=oi-1; i>=0 && remain>0; i--){
    const x=FULL_ORDER[i];
    const cur=num(o.steps[x]);
    if(cur<=0) continue;
    const take=Math.min(cur, remain);
    o.steps[x]=cur-take; remain-=take;
    chg.push(x+' '+cur+'→'+(cur-take));
  }
  return chg;
}
/* 流转模式下，入仓（车间仓/成品仓）视为离开工序，自动清空各工序在制 */
function flowDeductOnStore(o, v){
  if(!flowOn() || !(v>0)) return [];
  if(deductMode()==='off') return [];
  const chg=[];
  // 按工艺路线从后往前消耗，保证总量守恒
  const order=FULL_ORDER.slice().reverse();
  let remain=v;
  for(let i=0;i<order.length && remain>0;i++){
    const x=order[i];
    const cur=num((o.steps||{})[x]);
    if(cur<=0) continue;
    const take=Math.min(cur, remain);
    o.steps[x]=cur-take; remain-=take;
    chg.push(x+' '+cur+'→'+(cur-take));
  }
  // 未纳入 FULL_ORDER 的自定义工序，兜底再消耗一次
  if(remain>0){
    Object.keys(o.steps||{}).forEach(x=>{
      if(remain<=0) return;
      if(FULL_ORDER.indexOf(x)>=0) return;

/* ============ 数据加密（AES-GCM + PBKDF2）============
   目的：云端存的是密文。别人就算拿到网址里的 key，读到的也是密文，解不开。
   口令（passphrase）只存在本机，绝不上传；云端只存密文。

let ENC_MEM = null;                      // 本次会话记住的口令（内存）
const ENC_LS = 'prod_enc_pass';          // 「记住口令」时存这里（仅本机）
function encReady(){
  try{ return typeof crypto!=='undefined' && !!crypto.subtle && !!crypto.subtle.deriveKey; }catch(e){ return false; }
}
/* 口令来源优先级：内存 → localStorage（记住过） */
function encPass(){ return ENC_MEM || (localStorage.getItem(ENC_LS)||''); }

function b64(u8){ let b=''; const n=u8.length;
  for(let i=0;i<n;i++) b+=String.fromCharCode(u8[i]); return btoa(b); }
function unb64(str){ const b=atob(str); const u=new Uint8Array(b.length);
  for(let i=0;i<b.length;i++) u[i]=b.charCodeAt(i); return u; }
async function deriveKey(pass, salt){
  const km=new TextEncoder().encode(pass);
  const base=await crypto.subtle.importKey('raw', km, 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2', salt:salt, iterations:150000, hash:'SHA-256'},
    base, {name:'AES-GCM', length:256}, false, ['encrypt','decrypt']);

async function encObj(obj){

  const k=await deriveKey(pass, salt);
  const ct=await crypto.subtle.encrypt({name:'AES-GCM', iv:iv}, k,

// Excel 序列号 <-> 日期
const EPOCH = Date.UTC(1899,11,30);
function ser2d(n){ if(!n||isNaN(n)) return ''; if(n>20000&&n<60000){ const d=new Date(EPOCH+n*86400000);
  return d.getUTCFullYear()+'-'+p2(d.getUTCMonth()+1)+'-'+p2(d.getUTCDate()); } return ''; }
function d2ser(s){ if(!s) return null; const [y,m,d]=s.split('-').map(Number);
  return Math.round((Date.UTC(y,m-1,d)-EPOCH)/86400000); }
const p2 = n => String(n).padStart(2,'0');
function today(){ const d=new Date(); return d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate()); }
function weekLabel(s){ const ser=d2ser(s); if(!ser) return '';
  const dow=(ser+5)%7; // 0=周一（以1月1日为第1周起算，与车间计法一致）
  const mon=ser-dow; const y=new Date(EPOCH+mon*86400000).getUTCFullYear();
  const start=new Date(Date.UTC(y,0,1)); const wk=Math.floor((mon-Math.round((start-EPOCH)/86400000))/7)+1;
  return y+'年第'+wk+'周'; }
function fmtDate(v){ if(!v) return ''; if(typeof v==='number') return ser2d(v);
  if(v instanceof Date) return v.getFullYear()+'-'+p2(v.getMonth()+1)+'-'+p2(v.getDate());
  const s=String(v).trim(); if(/^\d{5}$/.test(s)) return ser2d(+s);
  const m=s.match(/(\d{4})[-\/年](\d{1,2})[-\/月](\d{1,2})/); if(m) return m[1]+'-'+p2(+m[2])+'-'+p2(+m[3]);
  if(/^\d{1,2}:\d{2}/.test(s)) return '';      // 纯时间值（Excel 残留），无日期意义
  return ''; }                                   // 无法识别的一律置空，避免脏数据显示

/* 预置数据升级：把新版本新增的字段补进已有订单，不覆盖用户已填内容 */
function migrate(force){
  const v = force ? 0 : (num(S.meta.ver)||0);
  if(v >= APP_VER && !force) return 0;
  const m = oMap();
  let nStep=0, nNew=0;
  SEED_ORDERS.forEach(so=>{
    const k=keyOf(so), o=m[k];
    if(!o){ // 本地缺失的订单 → 补进来
      S.orders.push({...so,plan:{...(so.plan||{})},steps:{...(so.steps||{})},hist:[...(so.hist||[])]}); m[k]=S.orders[S.orders.length-1]; nNew++; return;
    }
    // 补工序：用户已填的值优先，种子补齐缺失项
    if(so.steps && Object.keys(so.steps).length){
      const cur = o.steps||{};
      const merged = Object.assign({}, so.steps, cur);
      if(JSON.stringify(merged)!==JSON.stringify(cur)){ o.steps=merged; nStep++; }
    }
    if(!o.planQty && so.planQty) o.planQty = so.planQty;
    if(so.plan && Object.keys(so.plan).length && !Object.keys(o.plan||{}).length) o.plan = {...so.plan};
  });
  // 工序配置升级：为各工段补上「维修」通用工序（v5，只做一次）
  if(S.meta.steps && !S.meta.repDone){
    Object.keys(S.meta.steps).forEach(sec=>{
      if(Array.isArray(S.meta.steps[sec]) && !S.meta.steps[sec].includes('维修'))
        S.meta.steps[sec].push('维修');
    });
    S.meta.repDone = 1;
  }
  S.meta.ver = APP_VER;
  if(nStep||nNew) setTimeout(save,0);
  return {nStep,nNew};
}

/* 立即把当前数据推到云端（不依赖 autosync），返回是否成功 */
async function pushUsersNow(){
  const a=api(); if(!a) return false;
  try{
    const g=await fetch(a.url+'?id=eq.'+encodeURIComponent(a.id)+'&select=data',
      {headers:{'apikey':a.key,'Authorization':'Bearer '+a.key}});
    if(g.ok){ const cj=await g.json();
      const cu=cj&&cj[0]&&cj[0].data&&cj[0].data.meta&&cj[0].data.meta.users;
      if(cu&&cu.length) S.meta.users=mergeUsers(S.meta.users||[],cu); }
    const r=await fetch(a.url,{method:'POST',headers:{'apikey':a.key,'Authorization':'Bearer '+a.key,
      'Content-Type':'application/json','Prefer':'resolution=merge-duplicates,return=minimal'},
      body:JSON.stringify({id:a.id,data:S,updated_at:new Date().toISOString()})});
    if(!r.ok) throw new Error(await r.text());
    S.meta.cloudAt=new Date().toISOString();
    try{ localStorage.setItem(LS,JSON.stringify(S)); }catch(e){}
    toast('✅ 已同步到云端，其他设备刷新即可登录','ok');
    return true;
  }catch(e){ toast('同步失败：'+e.message+'（账号已存本机）','err'); return false; }
}

async function pullUsersFromCloud(){
  const a=api(); if(!a) return 0;
  try{
    const r=await fetch(a.url+'?id=eq.'+encodeURIComponent(a.id)+'&select=data',
      {headers:{'apikey':a.key,'Authorization':'Bearer '+a.key}});
    if(!r.ok) return -1;          // -1 = 连上了但接口报错（403/404等）
    const j=await r.json();
    const cu=j&&j[0]&&j[0].data&&j[0].data.meta&&j[0].data.meta.users;
    if(!cu||!cu.length) return 0;
    const before=(S.meta.users||[]).length;
    S.meta.users=mergeUsers(S.meta.users||[],cu);
    if(S.meta.users.length!==before){ try{ localStorage.setItem(LS,JSON.stringify(S)); }catch(e){} }
    return Math.max(0,S.meta.users.length-before);
  }catch(e){ return -1; }         // -1 = 网络异常
}

/* ===== 组装段「包装」工序数据 → 挪到车间仓 =====
   背景：包装不属于组装工段（是包装工段的正式工序），组装段出现它是历史跨工段填报。
   规则（按需求）：
     1) 车间仓已有数量 = 下单数 → 说明已记全，不再挪（避免重复计）
     2) 车间仓 + 包装值 ≤ 下单数 → 相加
     3) 相加会超过下单数 → 截断到下单数（任何数量不得超开单）
   挪完把「包装」加入组装段隐藏名单，列不再出现。 */
function migratePackToWs(silent){
  if(!canCfg()){ toast('仅超级管理员可操作','err'); return 0; }
  const cfg=CFG(); const asm=cfg['组装']||[];
  if(asm.indexOf('包装')>=0) return 0;          // 包装是组装段正式工序 → 不动
  let moved=0, skipped=0, touched=0;
  (S.orders||[]).forEach(o=>{
    if(o.section!=='组装') return;
    const v=num((o.steps||{})['包装']);
    if(v<=0) return;
    const q=num(o.qty), ws=num(o.workshop);
    if(ws>=q && q>0){                            // 车间仓已记满 → 数量不并入，避免重复
      skipped++;
      // 但列已删、数据必须一起清掉，否则「当前工序」明细里还会出现"包装"
      if(o.steps){ delete o.steps['包装']; }
    }
    else {
      let nw=ws+v;
      if(q>0 && nw>q) nw=q;                     // 不超下单
      o.workshop=nw; moved+=v;
      o.steps=o.steps||{};
      delete o.steps['包装'];                   // 从工序里移除
      o.hist=o.hist||[]; o.hist.push({t:new Date().toLocaleString('zh-CN'),f:'车间仓（包装并入）',v:String(nw),u:whoAmI()});
    }
    touched++;
  });
  // 隐藏：组装段不再显示「包装」列
  S.meta.hideSteps=S.meta.hideSteps||{};
  S.meta.hideSteps['组装']=S.meta.hideSteps['组装']||[];
  if(S.meta.hideSteps['组装'].indexOf('包装')<0) S.meta.hideSteps['组装'].push('包装');
  if(touched){ save(); if(!silent){ toast('已处理 '+touched+' 张单：并入车间仓 '+moved+' 台'
    +(skipped?('，'+skipped+' 张车间仓已满跳过'):'')+'，组装段不再显示「包装」列','ok'); } }
  else if(!silent) toast('没有需要处理的组装段包装数据','ok');
  return touched;
}

// 在表头行中按关键字定位列
function findCol(head, kws){ for(const kw of kws){ const i=head.findIndex(h=>h&&String(h).replace(/\s/g,'').includes(kw)); if(i>=0) return i; } return -1; }
function rowsOf(ws){ const out=[]; for(const r of XLSX.utils.sheet_to_json(ws,{header:1,raw:true,defval:null,blankrows:false})) out.push(r); return out; }

const isSer = v => (typeof v==='number' && v>20000 && v<60000);
const serOf = v => isSer(v) ? v : (v instanceof Date ?
  Math.round((Date.UTC(v.getFullYear(),v.getMonth(),v.getDate())-EPOCH)/86400000) : 0);
// 从备注里抓出货/交付日期，如 "9/18出货" "14号出货" "9月21出货"
function extractDue(note){
  if(!note) return '';
  const s=String(note);
  const segs=s.split(/[，,；;、]/).filter(x=>/出货|交付|交期|发货/.test(x));
  for(const g of segs.concat([/出货|交付|交期/.test(s)?s:''])){
    if(!g) continue;
    let m=g.match(/(\d{1,2})\s*月\s*(\d{1,2})\s*[号日]?/);
    if(!m) m=g.match(/(\d{1,2})\s*[\/\-]\s*(\d{1,2})/);
    if(!m) m=g.match(/(\d{1,2})\s*[号日](?=出|交|发)/);
    if(m){
      const y=new Date().getFullYear();
      const mo = m[2]!==undefined ? +m[1] : new Date().getMonth()+1;
      const da = m[2]!==undefined ? +m[2] : +m[1];
      if(mo>=1&&mo<=12&&da>=1&&da<=31) return y+'-'+p2(mo)+'-'+p2(da);
    }
  }
  return '';
}
// 周计划格式：多 sheet，每个 sheet 标题行（含工段）+ 表头行 + 日期行
function parsePlan(wb, opt){
  opt=opt||{};
  const list=[];
  wb.SheetNames.forEach(name=>{
    if(/调拨|工时|标准|物料|流水|清单|报表|统计|查询/i.test(name)) return;
    const ws=wb.Sheets[name]; if(!ws) return;
    const rows=rowsOf(ws);
    let titleSec='', hi=-1;
    for(let i=0;i<Math.min(rows.length,8);i++){
      const joined=(rows[i]||[]).map(c=>c==null?'':String(c)).join('');
      if(joined && /生产计划|计划表|周计划|排产/i.test(joined) && !/订单号/.test(joined)){ titleSec=joined; continue; }
      if((rows[i]||[]).some(c=>c&&String(c).replace(/\s/g,'').includes('订单号'))){ hi=i; break; }
    }
    if(hi<0) return;
    const head=(rows[hi]||[]).map(c=>c==null?'':String(c));
    const cNo=findCol(head,['订单号','订单编号','生产订单','工单号']);
    const cCode=findCol(head,['产品编码','物料编码','编码']);
    const cName=findCol(head,['产品名称','物料名称','名称']);
    const cPlan=findCol(head,['本周总','计划数量']);        // 本周排产
    const cWo=findCol(head,['生产工单数','工单数','下达数量']); // 工单总量
    const cRem=findCol(head,['未完成数']);                   // 工单未完成
    const cDue=findCol(head,['要求交付','交付日期','交期','出货日期']);
    const cOd=findCol(head,['开单日期','下单日期','制单日期','开工日期']);
    const cNote=Math.max(0,head.length-1);
    if(cNo<0||cCode<0) return;
    // 表头下一行若是一排日期 → 日期行（周一..周日）
    let dateRow=null;
    const nxt=rows[hi+1]||[];
    if(nxt.filter(v=>serOf(v)>0).length>=3) dateRow=nxt;
    const sec=(titleSec.match(/(焊接|模组|灌胶|组装|装配|包装|测试|原材料)/)||[])[0]
           ||(name.match(/(焊接|模组|灌胶|组装|装配|包装|测试)/)||[])[0]||'';
    const ds = dateRow ? dateRow.map(serOf).filter(Boolean) : [];
    const od = ds.length? ser2d(Math.min(...ds)) : '';
    const wkDue = ds.length? ser2d(Math.max(...ds)) : '';
    /* 日期列的列号（dateRow[i] 是日期序列号）。排产表可能有两周，
       所以不能用「星期名」找列（会出现两个星期一互相覆盖），一律按列号扫。 */
    const dateCols=[];
    if(dateRow) for(let ci=0; ci<dateRow.length; ci++){
      const sv=serOf(dateRow[ci]); if(sv>0) dateCols.push([ci, sv]);
    }
    for(let i=hi+(dateRow?2:1); i<rows.length; i++){
      const r=rows[i]; if(!r) continue;
      const no=r[cNo]==null?'':String(r[cNo]).trim();
      if(!no||/^合\s*计|^小计|^总\s*计|^订单号$|^序号$/.test(no)) continue;
      const code=r[cCode]==null?'':String(r[cCode]).trim();
      if(!code||!/[0-9A-Za-z]/.test(code)) continue;
      const pick=i2=> (i2>=0 && r[i2]!=null && typeof r[i2]==='number' && r[i2]>=0) ? r[i2] : null;
      let qty=pick(cWo), remain=pick(cRem), planQty=pick(cPlan);
      if(qty==null) qty = (remain!=null?remain:(planQty!=null?planQty:0));
      if(remain==null) remain=qty; if(planQty==null) planQty=remain;
      let due = cDue>=0? fmtDate(r[cDue]) : '';
      let note = cNote>=0 && r[cNote]!=null ? String(r[cNote]).trim() : '';
      if(!note){ for(let k=cNote>0?cNote:r.length-1;k>=0;k--){
        if(k<=cName) break;
        if(typeof r[k]==='string'&&/[\u4e00-\u9fa5]/.test(r[k])){ note=r[k].trim(); break; } } }
      /* 注意：这里不要回填（extractDue / wkDue），否则会盖掉后面按「该行排产最后一天」算出的交期。
         统一由下面按优先级处理：
         表中「要求交付」列 > 该行排产最后一天 > 备注里的日期 > 整周最后一天 > 开单日期 */
      /* 该行真实排产的日期范围：
         开单日期 = 排产的第一天；交付日期 = 排产的最后一天。
         - 同一张单分几天做 → 交付 = 最后做完那天
         - 只排了一天      → 开单 = 交付 = 当天 */
      const plan={}; let rowOd='', rowDue='', rowGap=0, rowCross=false;
      if(dateCols.length){
        let mn=0, mx=0;
        for(const [ci,sv] of dateCols){
          const q=r[ci];
          if(q==null || typeof q!=='number' || !(q>0)) continue;
          if(!mn || sv<mn) mn=sv;
          if(!mx || sv>mx) mx=sv;
          const wn=(head[ci]!=null?String(head[ci]).replace(/\s/g,''):'');
          const key=ser2d(sv).slice(5)+(wn?' '+wn:'');   // 如 "09-21 星期一"
          plan[key]=(plan[key]||0)+q;
        }
        if(mn) rowOd=ser2d(mn);
        if(mx) rowDue=ser2d(mx);
        /* 跨假期识别：排产日期之间的最大空档。
           例：09-23、09-24 后直接跳到 10-04（中间隔了中秋+国庆 9 天）
           → gapDays=9，标记「跨假期」，提醒这张单中间停产。 */
        const svs=[]; for(const [ci,sv] of dateCols){
          const q=r[ci]; if(q==null||typeof q!=='number'||!(q>0)) continue; svs.push(sv); }
        svs.sort((a,b)=>a-b);
        let gap=0;
        for(let gi=1; gi<svs.length; gi++){
          const d=svs[gi]-svs[gi-1]; if(d-1>gap) gap=d-1;
        }
        if(gap>=3){ rowGap=gap; rowCross=true; }
      }
      if(!Object.keys(plan).length){
        ['星期一','星期二','星期三','星期四','星期五','星期六','星期日'].forEach(w=>{
          const ci=head.findIndex(h=>h&&String(h).replace(/\s/g,'').includes(w));
          if(ci>=0&&r[ci]!=null&&typeof r[ci]==='number'&&r[ci]>0) plan[w]=r[ci];
        });
      }
      /* 开单日期（决定这张单是「正常」还是「待定」）：
         ① 该单有排产 → 用排产首日（有开工日 = 正常订单）
         ② 表里单独写了开单日期列 → 用它
         ③ 都没有 → 留空 = 待定订单（缺料/交期待定，不进生产进度）
         ★ 以前第③步会用「整周首日」兜底，导致没排产的单也被塞了日期，永远进不了待定页。 */
      const useOd = rowOd || (cOd>=0? fmtDate(r[cOd]) : '') || '';
      /* 交付日期优先级：表里的「要求交付」列 > 该单排产最后一天 > 备注里写的日期 > 整周最后一天 */
      if(!due) due = rowDue || extractDue(note) || wkDue || useOd;
      list.push(newOrder({no,code,name:cName>=0?String(r[cName]||'').trim():'',qty,
        remain,planQty,orderDate:useOd,dueDate:due,section:sec,note,plan,src:opt.label,
        gapDays:rowGap, crossHoliday:rowCross}));
    }
  });
  return list;
}
// 订单明细 / 完工明细：通用格式
/* 进度报表格式：订单编号 + 工段 + 下单数量 + 各工序列（焊接/灌胶/模组/空舱…） */
const PROG_RENAME={'焊接':'焊接','灌胶':'灌胶','模组':'模组','空舱组装':'空舱','实舱组装':'实舱',
  '组装':'配件/整机组装','整机打压':'配件/整机打压','姿态1':'姿态1','空舱打压':'空舱打压',
  '实舱打压':'实舱打压','老化':'老化','姿态2':'姿态2','烘烤':'烘烤','包装':'包装','维修':'维修'};
function parseProgress(wb, opt){

      if(/订单编号|订单号/.test(j) && /工段/.test(j) && /(焊接|灌胶|空舱|包装|维修)/.test(j)){ hi=i; break; }

        orderDate:cOd>=0?fmtDate(r[cOd]):'', dueDate:cDue>=0?fmtDate(r[cDue]):'',
        unit:cUnit>=0?(String(r[cUnit]||'').trim()||'PCS'):'PCS',
        note:cNote>=0?String(r[cNote]||'').trim():'', steps, src:opt.label});
      list.push(o);
    }
  });
  return list;
}

function parseStd(wb, kind, opt){
  opt=opt||{};
  const skip=/工时|调拨|流水|标准工时|进度报表|产量统计|订单查询|导航|产品信息/i;
  let names=wb.SheetNames.filter(n=>!skip.test(n));
  if(kind==='done'){ // 优先挑真正带「车间仓/成品仓」的 Sheet
    const hit=names.filter(n=>{
      const rows=rowsOf(wb.Sheets[n]);
      for(let i=0;i<Math.min(rows.length,10);i++){
        const j=(rows[i]||[]).map(c=>String(c==null?'':c)).join('');
        if(/车间仓|成品仓|完工数量/.test(j)) return true;
      } return false; });
    if(hit.length) names=hit;
  }else{ // 订单：避开完工明细这类带车间仓的表
    const hit=names.filter(n=>{
      const rows=rowsOf(wb.Sheets[n]);
      for(let i=0;i<Math.min(rows.length,10);i++){
        const j=(rows[i]||[]).map(c=>String(c==null?'':c)).join('');
        if(/车间仓|成品仓/.test(j)) return false;
        if(/订单编号|订单号/.test(j)&&/产品编码/.test(j)) return true;
      } return false; });
    if(hit.length) names=hit;
  }
  const list=[];
  names.forEach(n=>{ parseStdSheet(wb.Sheets[n],kind,opt,n).forEach(o=>list.push(o)); });
  return list;
}
/* 合并：去重 + 刷新未完工状态 */
function merge(list, kind){
  const m=oMap(); const rep={added:0,updated:0,skipped:0,detail:[]};
  const seen={};
  list.forEach(o=>{
    const k=keyOf(o);
    if(seen[k]){ rep.skipped++; return; }   // 同文件内重复直接去掉
    seen[k]=1;
    const old=m[k];
    if(!old){
      if(o.code && !prodOf(o.code)) S.products.push({code:o.code,name:o.name,unit:o.unit||'PCS',section:o.section});
      S.orders.push(o); m[k]=o; rep.added++;
      rep.detail.push(['新增',o.no,o.code,o.name,o.qty]);
    }else{
      // 保留已填报的完工数据，刷新计划/交期等
      const ws=old.workshop, fn=old.finished, dd=old.doneDate, hist=old.hist||[];
      const chg=[];
      if(kind!=='done' && kind!=='prog'){
        if(num(o.qty)>0 && num(old.qty)!==num(o.qty)) chg.push('下达 '+old.qty+'→'+o.qty);
        if(o.dueDate&&old.dueDate!==o.dueDate) chg.push('交期 '+(old.dueDate||'空')+'→'+o.dueDate);
        if(o.note&&o.note!==old.note) chg.push('备注更新');
        if(num(o.qty)>0) old.qty=o.qty;   // 新表数量为0或空时不覆盖，防止误清
        if(o.dueDate) old.dueDate=o.dueDate;
        if(o.orderDate) old.orderDate=o.orderDate;
        if(o.name) old.name=o.name; if(o.section) old.section=o.section;
        old.unit=o.unit||old.unit;
        if(o.remain!=null) old.remain=o.remain;
        if(o.planQty!=null) old.planQty=o.planQty;
        if(o.plan&&Object.keys(o.plan).length) old.plan=o.plan;
        if(o.note) old.note=o.note;
        if(!old.steps) old.steps={};
      }else if(kind==='prog'){
        // 进度报表：只合并工序流转数量，不动车间仓/成品仓/下达量
        old.steps=Object.assign({},old.steps||{},o.steps||{});
        const ns=Object.keys(o.steps||{});
        if(ns.length) chg.push('工序 '+ns.map(k=>k+':'+o.steps[k]).join('，'));
      }else{
        old.workshop=o.workshop; old.finished=o.finished;
        if(o.doneDate) old.doneDate=o.doneDate;
        if(o.qty) old.qty=o.qty;
        chg.push('完工 '+old.workshop+'/'+old.finished);
      }
      old.workshop=ws; if(kind==='done'){ old.workshop=o.workshop; }
      old.finished=fn; if(kind==='done'){ old.finished=o.finished; }
      old.doneDate = kind==='done' ? (o.doneDate||dd||'') : (dd||o.doneDate||'');
      old.hist=hist;
      old.src=o.src; old.refreshAt=today();
      if(fn>0 && num(old.qty)>0 && fn>=num(old.qty)) old.doneFlag=1; else old.doneFlag=0;
      rep.updated++;
      rep.detail.push([chg.length?'刷新 '+chg.join('；'):'无变化',o.no,o.code,o.name,o.qty]);
    }
  });
  return rep;
}

$('#file').addEventListener('change',e=>{ if(e.target.files[0]) readFile(e.target.files[0]); e.target.value=''; });
function readFile(f){
  const kind=$('#impKind')?$('#impKind').value:'auto';
  const label=($('#impLabel')&&$('#impLabel').value.trim())||f.name.replace(/\.(xlsx|xls|csv)$/i,'');
  toast('正在解析 '+f.name+' ...');
  const fr=new FileReader();
  fr.onload=ev=>{
    try{
      const wb=XLSX.read(new Uint8Array(ev.target.result),{type:'array',cellDates:true});
      let list=[];
      if(kind==='plan') list=parsePlan(wb,{label});
      else if(kind==='order') list=parseStd(wb,'order',{label});
      else if(kind==='done') list=parseStd(wb,'done',{label});
      else if(kind==='prog') list=parseProgress(wb,{label});
      else{
        list=parsePlan(wb,{label});
        if(!list.length) list=parseProgress(wb,{label});
        if(!list.length) list=parseStd(wb,'order',{label});
        const dl=parseStd(wb,'done',{label});
        if(dl.some(o=>o.finished>0||o.workshop>0)) list=dl;
      }
      const before=list.length;
      list=list.filter(o=>!/原材料|原料仓/.test(o.section||''));
      if(list.length!==before) toast('已自动过滤原材料/原料仓 '+ (before-list.length) +' 行');
      if(!list.length){ toast('没解析到有效订单行，请检查表头或换一种类型','err'); return; }
      pending=list; showPreview(list,kind,label);
    }catch(err){ toast('解析失败：'+err.message,'err'); }
  };
  fr.readAsArrayBuffer(f);
}

/* 完成量 = 车间仓 + 成品仓（进入任一仓即视为完成） */
/* 完成量 = 车间仓 + 成品仓 + 已发货。
   计入发货是为了「不影响工单完工」：货发出去后成品仓减少，
   但完工事实不变，否则订单会从"已完工"退回"进行中"。 */
const doneQty = o => num(o.workshop) + num(o.finished) + num(o.shipped);
/* 仓库现存（未发货）= 车间仓 + 成品仓 */
const stockQty = o => num(o.workshop) + num(o.finished);
const TD = (list,Q) => list.reduce((s,o)=>s+num(o[Q]),0);
const TDF = list => list.reduce((s,o)=>s+doneQty(o),0);
function statusOf(o){
  const q=num(o.qty), d=doneQty(o), w=wipOf(o), inp=inputOf(o);
  if(q<=0) return ['<span class="badge b-gray">无数量</span>',0];
  if(d>q) return ['<span class="badge b-warn">超产完工</span>',100];
  if(d>=q) return ['<span class="badge b-ok">已完工</span>',100];
  if(d>0||w>0) return ['<span class="badge b-warn">进行中</span>',Math.round(Math.max(d,inp)/q*100)];
  return ['<span class="badge b-err">未开工</span>',0];
}
/* 焦点保持：页面重建后把光标放回原处，避免"输一个字就跳" */
let FOCUS=null;
function grabFocus(){
  FOCUS=null;
  const ae=document.activeElement;
  // 只要是可聚焦元素（有 focus 方法）就记录，不依赖 tagName，兼容性更好
  if(ae&&ae.id&&typeof ae.focus==='function'){
    FOCUS={id:ae.id,pos:(typeof ae.selectionStart==='number')?ae.selectionStart:null};
  }
}
function putFocus(){
  if(!FOCUS||!FOCUS.id) return;
  const el=document.getElementById(FOCUS.id); if(!el) return;
  try{ el.focus({preventScroll:true});
    if(FOCUS.pos!=null && typeof el.setSelectionRange==='function') el.setSelectionRange(FOCUS.pos,FOCUS.pos);
  }catch(e){}
  FOCUS=null;
}
function render(){
  CELL_SUPER_ONLY=false;   // 默认管理员可编辑；进度跟踪页会在其内部改回 true
  if(typeof TABS_ALL!=='undefined') TABS=visTabs();

  grabFocus();
  try{
    if(cur==='dash') renderDash();
    else if(cur==='order') renderOrder();
    else if(cur==='done') renderDone();
    else if(cur==='query'){ cur='stat'; renderStat(); }
    else if(cur==='stat') renderStat();
    else if(cur==='prod') renderProd();
    else if(cur==='mat') renderMat();
    else if(cur==='bal') renderBal();
    else if(cur==='hold') renderHold();
    else if(cur==='mob') renderMob();

    restoreScroll(SC);
    if(!afterEditFocus()) putFocus();   // 填报后跳下一格；否则恢复原焦点
  }
}

function filtOrd(){
  const kw=(($('#kw')&&$('#kw').value)||'').trim().toLowerCase();
  const sec=(($('#fSec')&&$('#fSec').value)||'');
  const st=(($('#fSt')&&$('#fSt').value)||'');
  const hol=(($('#fHol')&&$('#fHol').value)||'');
  /* 订单明细是「查询管理页」，必须能看到全库所有订单（含待定单），
     否则会出现"统计页搜得到、明细页搜不到"的诡异现象。
     待定单用 ⏳ 标注；生产进度类页面（看板/进度/统计/手机）才排除待定单。 */
  return (S.orders||[]).filter(o=>{
    if(hol){
      const inH = !!isHoliday(o.orderDate) || !!isHoliday(o.dueDate) || holidayBadge(o)!=='';
      const cr  = crossBadge(o)!=='';
      if(hol==='in' && !inH) return false;
      if(hol==='cross' && !cr) return false;
    }
    if(sec && o.section!==sec) return false;
    if(kw && !(o.no+' '+o.code+' '+o.name).toLowerCase().includes(kw)) return false;
    if(st){ const s=statusOf(o)[0];
      if(st==='undone'&&!(s.includes('未开工')||s.includes('进行中'))) return false;
      if(st==='done'&&!s.includes('已完工')) return false;
      if(st==='open'&&s.includes('已完工')) return false; }
    return true;
  });
}

function setStep(k,st,el){
  const o=oMap()[k]; if(!o) return;
  if(!canEdit()){ toast('浏览模式无权修改，请登录管理员账号','err'); render(); return; }
  if(!o.steps) o.steps={};
  const qty=num(o.qty);
  markEdit(el);            // 记住刚编辑的格子，渲染后光标跳到下一张工单的同一列
  let v=num(el.value);
  // 硬约束：任何工序的填报量都不得超过下达数量（总数最终与下达一致）
  if(qty>0 && v>qty){
    v=qty; if(el) el.value=qty;
    toast('⚠️ 「'+st+'」最多 '+qty+'（=下达数量），已自动修正','err');
  }
  const oldv=num(o.steps[st]);
  o.steps[st]=v;
  const chg = (v>oldv) ? flowDeduct(o, st, v-oldv) : [];   // 只在增加时扣减前面的工序
  if(oldv!==v){ logChg(o,'S:'+st,oldv,v); }
  if(chg.length) logChg(o,'流转自动扣减','',chg.join('，'));
  autoDoneDate(o);      // 达成完工时自动记完成日期（可手工改）
  save(); render();
  if(chg.length) toast('流转：'+chg.join('，'),'ok');
}
/* ===== 跨假期标记 =====
   排产日期之间出现 >=3 天空档，说明中间停产（中秋/国庆等）。
   例：09-23、09-24 → 10-04，中间空 9 天 = 中秋+国庆。
   交付日仍取最后排产日（那是实际最后做完那天），但界面标出来，避免误以为是数据缺失。 */
/* ===== 假期表 =====
   放假区间由超管在设置里维护，存 S.meta.holidays（[{from,to,name}]）。
   默认预置：2026 中秋+国庆 09-25 ~ 10-03 共 9 天，10-04 上班。
   用途：① 识别排产跨假期的单；② 检查有没有单被排在假期内（那是计划异常）。 */
const DEF_HOLIDAYS = [
  {from:'2026-09-25', to:'2026-10-03', name:'中秋国庆'}
];
function holidays(){ return (S.meta && Array.isArray(S.meta.holidays)) ? S.meta.holidays : DEF_HOLIDAYS; }
/* 某天是否在假期内 */
function isHoliday(d){
  if(!d) return null;
  const x=String(d).slice(0,10); if(x.length<10) return null;
  for(const h of holidays()){
    if(x>=h.from && x<=h.to) return h;
  }
  return null;
}
/* 从 a 到 b 之间（含端点）落在假期里的天数和名字 */
function holidaySpan(a,b){
  const out=[];
  holidays().forEach(h=>{
    const s=String(a||'').slice(0,10), e=String(b||'').slice(0,10);
    if(!s||!e) return;
    const lo = h.from > s ? h.from : s;      // 重叠起点
    const hi = h.to   < e ? h.to   : e;      // 重叠终点
    if(lo <= hi){
      const days = Math.round((new Date(hi)-new Date(lo))/86400000)+1;
      if(days>0) out.push({name:h.name, days});
    }
  });
  return out;
}
/* 排产日被排进假期 → 异常提醒（计划不该让人假期来上班） */
function holidayBadge(o){
  if(!o) return '';
  const hits=[];
  Object.keys(o.plan||{}).forEach(k=>{
    const d=(k.match(/^(\d{2}-\d{2})/)||[])[1];
    if(!d) return;
    const y=String(o.orderDate||'2026').slice(0,4);
    const full=y+'-'+d;
    const h=isHoliday(full);
    if(h && !hits.some(x=>x.name===h.name)) hits.push(h);
  });
  if(hits.length) return `<span class="badge b-err" style="margin-left:4px"
    title="排产日落在${hits.map(x=>x.name).join('、')}假期内，请确认是否需要调整">⚠️ 假期内排产</span>`;
  return '';
}
/* 跨假期：排产首日到末日之间夹着假期（放假前干一批，收假后接着干） */
/* 跨假期标记。前提：这张单「确实跨日期」——同一天完成的单不标（不算跨）。
   例：开单=交付=10-03，虽然 10-03 是假期，但它是同一天做完，没有"跨"假期这回事。 */
function crossBadge(o){
  if(!o) return '';
  const a=String(o.orderDate||'').slice(0,10);
  const b=String(o.dueDate||'').slice(0,10);
  if(!a||!b) return '';
  if(a>=b) return '';              // 同一天 / 日期倒挂 → 不标
  const sp=holidaySpan(a,b);
  if(!sp.length) return '';
  const d=sp.reduce((t,x)=>t+x.days,0);
  const nm=sp.map(x=>x.name).join('、');
  return `<span class="badge" style="background:#fef3c7;color:#92400e;margin-left:4px"
    title="排产跨越「${nm}」假期（中间 ${d} 天放假），${a} 前做一批，${b} 收假后接着做">🏮 跨${nm} ${d}天</span>`;
}
/* 完成日期：达成完工条件且尚未填写时，自动记为今天；已填的保留，填表人可自行修改 */
/* ===== 待定订单 =====
   没有开工日期（orderDate 为空）的订单 = 待定订单（多为缺料、交期待定）。
   待定单不进生产进度统计，单独列在「⏳ 待定订单」页。
   填入开工日期 → 转回正常订单；已开工的缺料 → 清开工日期退回待定。 */
/* ===== 报错日志（便于正式上线后定位异常） =====
   捕获三类：window.onerror、Promise 未处理拒绝、console.error。
   存到 S.meta.errLog（最多 200 条），超管在「⚙️ 设置 → 🐞 报错日志」查看。
   注意：日志写入必须"静默失败"，否则报错触发保存、保存又报错会死循环。 */
function logErr(msg, src){
  try{
    if(typeof S==='undefined' || !S || !S.meta) return;
    if(!Array.isArray(S.meta.errLog)) S.meta.errLog=[];
    const m=String(msg==null?'':msg).slice(0,300);
    if(!m) return;
    // 相同的错误短时间内不重复记，避免刷屏
    const last=S.meta.errLog[S.meta.errLog.length-1];
    if(last && last.m===m) return;
    S.meta.errLog.push({t:new Date().toLocaleString('zh-CN'), m:m, s:String(src||'').slice(0,120)});
    if(S.meta.errLog.length>200) S.meta.errLog=S.meta.errLog.slice(-200);
    if(!logErr._t){ logErr._t=setTimeout(()=>{ logErr._t=null; try{ save(); }catch(e){} },1500); }
  }catch(e){ /* 静默 */ }
}
try{

/* ===== 发货 =====
   填「本次发货 n」→ 累计发货 +n，同时从成品仓扣（不够再从车间仓扣），
   并自动记发货日期。完工状态不受影响（doneQty 已计入 shipped）。 */
/* 统一的发货扣减：只从「有货」的仓扣，且绝不扣成负数
   顺序：成品仓优先，不够再从车间仓；两仓合计不足则按现存截断 */
/* 发货扣减：只从「有货的仓」扣，绝不扣成负数
   顺序：成品仓优先（成品仓是待发区），成品仓不够再用车间仓
   若两个仓都没货 → 实际发出 0，不改动任何仓库数量 */
function deductStock(o, n){
  let need=Math.max(0, num(n));
  const fin=Math.max(0, num(o.finished));   // 负数按 0 计（防历史脏数据）
  const ws =Math.max(0, num(o.workshop));
  if(need<=0 || (fin<=0 && ws<=0)) return {n:0, fromFin:0, fromWs:0, lacked:need};
  const fromFin=Math.min(fin, need);        // 成品仓有多少扣多少
  const fromWs =Math.min(ws, need-fromFin); // 不够的部分再从车间仓补
  const real=fromFin+fromWs;
  o.finished=Math.max(0, fin-fromFin);      // 结果强制非负
  o.workshop =Math.max(0, ws -fromWs);
  return {n:real, fromFin, fromWs, lacked:need-real};
}
function setShip(k, el){
  const o=oMap()[k]; if(!o) return;
  if(!canEdit()){ toast('浏览模式无权修改，请登录管理员账号','err'); render(); return; }
  if(CELL_SUPER_ONLY && !canCfg()){ toast('进度跟踪页仅超级管理员可填写，管理员请到「📱 手机填报」页填报','err'); render(); return; }
  markEdit(el);
  let n=num(el.value); if(n<0) n=0;
  const stock=Math.max(0, num(o.finished))+Math.max(0, num(o.workshop));  // 现存按非负计
  if(n>stock){ n=stock; if(el) el.value=stock;
    toast('⚠️ 仓库现存只有 '+stock+'，最多发 '+stock,'err'); }
  if(n<=0){ save(); render(); return; }
  const r=deductStock(o, n);
  if(r.n<=0){ save(); render(); return; }
  o.shipped=num(o.shipped)+r.n;
  o.shipDate=today();
  const src=(r.fromFin&&r.fromWs)?('成品仓'+r.fromFin+'、车间仓'+r.fromWs)
           :r.fromFin?('成品仓'+r.fromFin):('车间仓'+r.fromWs);
  logChg(o,'shipped',num(o.shipped)-r.n,num(o.shipped),'本次发货 '+r.n+'，扣 '+src);
  save(); render();
  toast('已发货 '+r.n+'（扣 '+src+'），累计发货 '+num(o.shipped),'ok');
}
/* 撤销/修正发货：直接改累计发货数，并把差额退回成品仓 */
/* 直接改「已发货」：改小要退回仓库（回成品仓）；改大要从仓库扣，不能扣成负 */
/* 已发货：仅超级管理员可手工调整 */
function setShipped(k, el){
  const o=oMap()[k]; if(!o) return;
  if(!canCfg()){ toast('已发货仅超级管理员可修改','err'); render(); return; }
  if(!canEdit()){ toast('浏览模式无权修改，请登录管理员账号','err'); render(); return; }
  markEdit(el);
  let v=num(el.value); if(v<0){ v=0; if(el) el.value=0; }
  const old=num(o.shipped);
  const diff=old-v;                 // 正数=要退回仓库；负数=要多发
  if(diff>0){
    // 减少发货数 → 退回成品仓
    o.shipped=v;
    o.finished=Math.max(0,num(o.finished))+diff;
    o.hist=o.hist||[];
    o.hist.push({t:new Date().toLocaleString('zh-CN'),f:'发货数修正（退回成品仓）',v:old+'→'+v,u:whoAmI()});
  }else if(diff<0){
    // 增加发货数 → 从仓库扣（成品仓优先，不够车间仓，绝不扣负）
    const want=-diff;
    const stock=Math.max(0,num(o.finished))+Math.max(0,num(o.workshop));
    if(stock<=0){
      toast('仓库没有库存，不能增加发货数','err'); render(); return;
    }
    const real=Math.min(want, stock);
    const r=deductStock(o, real);
    o.shipped=num(o.shipped)+r.n;
    o.shipDate=o.shipDate||today();
    if(el) el.value=num(o.shipped);
    if(real<want) toast('⚠️ 仓库现存只有 '+stock+'，已按 '+real+' 计','err');
    o.hist=o.hist||[];
    const src=(r.fromFin&&r.fromWs)?('成品仓'+r.fromFin+'、车间仓'+r.fromWs)
             :r.fromFin?('成品仓'+r.fromFin):('车间仓'+r.fromWs);
    o.hist.push({t:new Date().toLocaleString('zh-CN'),f:'发货数修正（扣 '+src+'）',v:old+'→'+num(o.shipped),u:whoAmI()});
  }else{ return; }
  save(); render();
}

   cell=紧邻的下一格；off=留在原格不动 */

  if(!LASTEDIT || !LASTEDIT.id) return false;
  const mode=(S.meta && S.meta.nextCell) || 'row';
  const all=[]; try{ document.querySelectorAll('.cell-in').forEach(e=>all.push(e)); }catch(e){ return false; }
  const i=all.findIndex(e=>e.id===LASTEDIT.id);

    const el=document.getElementById(LASTEDIT.id);
    if(el){ try{ el.focus({preventScroll:true}); }catch(e){} }
    LASTEDIT=null; return true;
  }
  const cur=all[i]; let target=null;
  if(mode==='cell'){ target=all[i+1]||null; }
  else{
    for(let j=i+1;j<all.length;j++){
      if(all[j].dataset.col===cur.dataset.col && all[j].dataset.row!==cur.dataset.row){ target=all[j]; break; }
    }
  }
  if(target){
    try{ target.focus(); if(target.select) target.select(); }catch(e){}
    try{ target.scrollIntoView({block:'center',inline:'center'}); }catch(e){}
  }
  LASTEDIT=null; return true;
}

/* ===== 修正超出下达数量的库存 =====
   完成量 = 车间仓 + 成品仓 + 已发货，不能超过下达数。
   超出时：先减车间仓，再减成品仓（已发货是既成事实，不动）。
   目的：让「五档合计 = 开单」重新成立。 */
/* 超下达：完成量（车间仓+成品仓+已发货）> 下达数。
   全部列出（包括只超在已发货上的），由超管点按钮一次性截断。 */
function overQtyList(){
  return (S.orders||[]).filter(o=>{
    const q=num(o.qty); if(q<=0) return false;
    const ws=Math.max(0,num(o.workshop)), fin=Math.max(0,num(o.finished));
    const ship=Math.max(0,num(o.shipped));
    return (ws+fin+ship) > q;
  });
}
/* 截断顺序：车间仓 → 成品仓 → 已发货（最后才动已发货，因为那是既成事实） */
function fixOverQty(silent){
  if(!canCfg()){ toast('仅超级管理员可操作','err'); return 0; }
  let n=0;
  overQtyList().forEach(o=>{
    const q=num(o.qty);
    let ws=Math.max(0,num(o.workshop)), fin=Math.max(0,num(o.finished)), ship=Math.max(0,num(o.shipped));
    let over=ws+fin+ship-q;
    if(over<=0) return;
    const before=ws+fin+ship;
    const cutWs=Math.min(ws, over);  ws-=cutWs;  over-=cutWs;
    const cutFin=Math.min(fin, over); fin-=cutFin; over-=cutFin;
    const cutSp=Math.min(ship, over); ship-=cutSp; over-=cutSp;
    o.workshop=ws; o.finished=fin; o.shipped=ship;
    const parts=[];
    if(cutWs) parts.push('车间仓 -'+cutWs);
    if(cutFin) parts.push('成品仓 -'+cutFin);
    if(cutSp) parts.push('已发货 -'+cutSp);
    logChg(o,'超下达修正',String(before),String(ws+fin+ship),
      '完成 '+before+' > 下达 '+q+'，'+parts.join('、'));
    n++;
  });
  if(n){ save(); if(!silent) toast('已修正 '+n+' 张超下达的工单','ok'); }
  else if(!silent) toast('没有超出下达数量的工单','ok');
  return n;
}

/* ===== 工序合计 > 下达数量 =====
   成因：历史填报时同一批件在多道工序各记了一次（重复计），或跨工段工序混入。
   表现为「账实不符」，但仓库/发货都没超，所以 fixOverQty 管不到。
   处理：按工艺路线从最靠前的工序开始截断，直到工序合计 ≤ 下达数量。 */
function overStepList(){
  return (S.orders||[]).filter(o=>{
    const q=num(o.qty); if(q<=0) return false;
    return inputOf(o) > q + 0.001;
  });
}
function fixOverStep(silent){
  if(!canCfg()){ toast('仅超级管理员可操作','err'); return 0; }
  let n=0;
  (S.orders||[]).forEach(o=>{
    const q=num(o.qty); if(q<=0) return;
    const st=o.steps||{}; if(!Object.keys(st).length) return;
    let tot=0; Object.keys(st).forEach(k=>tot+=Math.max(0,num(st[k])));
    if(tot<=q+0.001) return;
    let over=tot-q;
    // 先按工艺路线顺序截，再处理不在工艺路线里的工序
    const seq=FULL_ORDER.filter(x=>st[x]!=null);
    const rest=Object.keys(st).filter(x=>seq.indexOf(x)<0);
    const parts=[];
    for(const k of seq.concat(rest)){
      if(over<=0.001) break;
      const v=Math.max(0,num(st[k])); if(v<=0) continue;
      const cut=Math.min(v,over);
      st[k]=Math.round((v-cut)*100)/100; over-=cut;
      parts.push(k+' -'+cut);
    }
    logChg(o,'工序超量修正',String(tot),String(Math.round((tot-over)*100)/100),
      '工序合计 '+tot+' > 下达 '+q+'，'+parts.join('、'));
    n++;
  });
  if(n){ save(); if(!silent) toast('已修正 '+n+' 张工序超量的工单','ok'); render(); }
  else if(!silent) toast('没有工序超量的工单','ok');
  return n;
}

/* 修复历史遗留的负数库存：仓库数量不可能为负，归零并记入历史 */
function fixNegStock(silent){
  if(!canEdit()){ toast('仅管理员/超级管理员可操作','err'); return 0; }
  let n=0;
  (S.orders||[]).forEach(o=>{
    const fin=num(o.finished), ws=num(o.workshop), sp=num(o.shipped);
    if(fin<0||ws<0||sp<0){
      const parts=[];
      if(fin<0){ parts.push('成品仓 '+fin+'→0'); o.finished=0; }
      if(ws <0){ parts.push('车间仓 '+ws +'→0'); o.workshop =0; }
      if(sp <0){ parts.push('已发货 '+sp+'→0'); o.shipped =0; }
      logChg(o,'负数修正','',parts.join('，'));
      n++;
    }
  });
  if(n){ save(); if(!silent) toast('已修正 '+n+' 张工单的负数库存','ok'); }
  else if(!silent) toast('没有负数库存，无需修正','ok');
  return n;
}
function hasNegStock(){
  return (S.orders||[]).some(o=>num(o.finished)<0||num(o.workshop)<0||num(o.shipped)<0);
}

function setNum(k,f,el){
  const o=oMap()[k]; if(!o) return;
  if(!canEdit()){ toast('浏览模式无权修改，请登录管理员账号','err'); render(); return; }
  if((CELL_SUPER_ONLY||isDonePage()) && !canCfg()){ toast('进度跟踪页仅超级管理员可填写，管理员请到「📱 手机填报」页填报','err'); render(); return; }
  /* 日期类字段必须按「文本」保存。原来只有 doneDate 走这条分支，
     shipDate 掉进了下面的 num(el.value)，'2026-09-18' 被算成 0 → 选了日期存不进去。 */
  if(f==='doneDate'||f==='shipDate'){ const _ov=o[f]; o[f]=el.value; logChg(o,f,_ov,el.value); }
  else{
    let v=num(el.value);
    const qty=num(o.qty);
    markEdit(el);
    // 仓库/工序数量都是实物件数，不能为负（之前没拦，导致成品仓被填成 -16）
    if((f==='workshop'||f==='finished'||f==='shipped') && v<0){
      v=0; if(el) el.value=0;
      toast('⚠️ 数量不能为负，已归零','err');
    }
    /* 完成量 = 车间仓 + 成品仓 + 已发货，三者合计不得超下达数量。
       原来只校验「单个字段 ≤ 下达」，于是出现 已发货16 + 车间仓16 = 32 > 下达16，
       缺口算成 -16、达成率 200%。现在按「合计」校验。 */
    if((f==='workshop'||f==='finished'||f==='shipped') && qty>0){
      const others = f==='workshop' ? num(o.finished)+num(o.shipped)
                   : f==='finished' ? num(o.workshop)+num(o.shipped)
                   : num(o.workshop)+num(o.finished);
      const room = Math.max(0, qty-others);
      if(v>room){
        v=room; if(el) el.value=room;
        toast('⚠️ 下达 '+qty+'，已发货/入库合计 '+others+'，此处最多填 '+room+'，已自动修正','err');
      }
    }
    const oldv=num(o[f]);
    o[f]=v;
    const chg=(v>oldv && (f==='workshop'||f==='finished')) ? flowDeductOnStore(o, v-oldv) : [];
    if(oldv!==v){ logChg(o,f,oldv,v);
      if(chg.length) logChg(o,'入仓自动扣减工序','',chg.join('，'));
      if(f==='finished'&&v>0) o.doneDate=today(); }
    autoDoneDate(o);
    if(chg.length) toast('入仓：'+chg.join('，'),'ok');
  }
  save(); render();
}

  let rows=Object.entries(g).sort((a,b)=>b[1].q-a[1].q);

  const tq=rows.reduce((s,r)=>s+r[1].q,0), td=rows.reduce((s,r)=>s+r[1].d,0), tw=rows.reduce((s,r)=>s+r[1].wip,0);

/* ============ 关键原材料 / 库存 ============
   三个库位：qLine=车间（在线/在制）、qWs=车间仓、qRaw=原料仓
   合计 = 三者之和；低于安全库存则预警。 */
function matOf(code){ return (S.materials||[]).find(m=>m.code===code); }
function matTotal(m){ return num(m.qLine)+num(m.qWs)+num(m.qRaw); }
function matLow(m){ const sf=num(m.safe); return sf>0 && matTotal(m)<sf; }
/* 是否关键物料：isKey 显式标记；未标记时若设了安全库存也算重点监控 */
function isKeyMat(m){ return m.isKey===1 || m.isKey===true; }
/* 风险分级（针对关键物料）：
   out=断料(0)  low=低于安全库存  warn=紧张(低于安全库存1.2倍)  ok=充足  na=未设安全库存 */
function matRisk(m){
  const t=matTotal(m), sf=num(m.safe);
  if(sf<=0) return 'na';
  if(t<=0) return 'out';
  if(t<sf) return 'low';
  if(t<sf*1.2) return 'warn';
  return 'ok';
}
const RISK_TXT={out:'🚫 断料',low:'⚠ 低于安全库存',warn:'🟡 紧张',ok:'✅ 充足',na:'— 未设'};
const RISK_CLS={out:'b-err',low:'b-err',warn:'b-warn',ok:'b-ok',na:'b-gray'};
const RISK_RANK={out:0,low:1,warn:2,na:3,ok:4};
/* 注意：out 的 rank 是 0，不能用 `RANK[x]||9` 兜底（0 会被当成 falsy 变成 9，导致断料排最后） */
const riskRank = m => { const v=RISK_RANK[matRisk(m)]; return (v===undefined||v===null)?9:v; };
/* 有库存风险 = 断料 / 低于安全库存 / 紧张 */
function matRisky(m){ const r=matRisk(m); return r==='out'||r==='low'||r==='warn'; }

/* 解析原材料 Excel */
function readMatFile(el){
  const f=el.files[0]; if(!f){ return; }
  el.value='';
  if(typeof XLSX==='undefined'){ toast('Excel组件未加载（可能断网），请刷新页面重试','err'); return; }
  if(!canCfg()){ toast('仅超级管理员可导入原材料清单','err'); return; }
  toast('正在解析 '+f.name+' ...');
  const fr=new FileReader();
  fr.onload=ev=>{
    try{
      const wb=XLSX.read(new Uint8Array(ev.target.result),{type:'array',cellDates:true});
      const list=parseMat(wb);
      if(!list.length){ toast('没解析到有效行，请检查是否有「料号」列','err'); return; }
      applyMat(list,f.name);
    }catch(err){ toast('解析失败：'+err.message,'err'); }
  };
  fr.readAsArrayBuffer(f);
}
function parseMat(wb){
  const out=[];
  wb.SheetNames.forEach(sn=>{
    const rows=rowsOf(wb.Sheets[sn]);
    // 找表头行：含"料号/物料编码/编码/编号"的那一行
    let hi=-1;
    for(let i=0;i<Math.min(rows.length,15);i++){
      const h=(rows[i]||[]).map(x=>String(x==null?'':x));
      if(h.some(x=>/料号|物料编码|物料编号|材料编码|编码|编号/.test(x))){ hi=i; break; }
    }
    if(hi<0) return;
    const head=(rows[hi]||[]).map(x=>String(x==null?'':x).trim());
    const cCode=findCol(head,['料号','物料编码','物料编号','材料编码','物料代码','编码','编号']);
    if(cCode<0) return;
    const cName=findCol(head,['名称','品名','物料名称','材料名称']);
    const cSpec=findCol(head,['规格','型号','规格型号']);
    const cUnit=findCol(head,['单位']);
    const cSup=findCol(head,['供应商','厂商','厂家','供货商']);
    const cSafe=findCol(head,['安全库存','最低库存','预警库存','最低存量']);
    // 找列时排除已被占用的列，避免「车间仓库」同时被 车间仓/原料仓 匹配到
    const used={};
    const pick=kws=>{ for(const kw of kws){
      const i=head.findIndex((h,j)=>h&&String(h).replace(/\s/g,'').includes(kw)&&!used[j]);
      if(i>=0){ used[i]=1; return i; } } return -1; };
    const cLine=pick(['车间在线','在线','在制','产线','车间在制','线上']);
    const cWs=pick(['车间仓','二级仓','线边仓','车间仓库']);
    const cRaw=pick(['原料仓','原材料仓','原材料仓库','原材料库存','仓库','库存']);
    const cKey=head.findIndex(h=>h&&/关键|重点|重要/.test(String(h)));
    for(let i=hi+1;i<rows.length;i++){
      const r=rows[i]||[];
      const code=String(r[cCode]==null?'':r[cCode]).trim();
      if(!code) continue;
      if(/^合\s*计|^小\s*计|^总\s*计/.test(code)) continue;   // 跳过合计行
      const txt=r.map(x=>String(x==null?'':x)).join('');
      if(!txt.trim()) continue;
      out.push({ code:code,
        name:cName>=0?String(r[cName]==null?'':r[cName]).trim():'',
        spec:cSpec>=0?String(r[cSpec]==null?'':r[cSpec]).trim():'',
        unit:cUnit>=0?String(r[cUnit]==null?'PCS':r[cUnit]).trim():'PCS',
        supplier:cSup>=0?String(r[cSup]==null?'':r[cSup]).trim():'',
        safe:cSafe>=0?num(r[cSafe]):0,
        qLine:cLine>=0?num(r[cLine]):0,
        qWs:cWs>=0?num(r[cWs]):0,
        qRaw:cRaw>=0?num(r[cRaw]):0,
        isKey:cKey>=0?(/是|关键|重点|重要|Y|y|1|√|✔/.test(String(r[cKey]==null?'':r[cKey]))):false });
    }
  });
  return out;
}
function applyMat(list,fname){
  S.materials=S.materials||[];
  let add=0,upd=0;
  const detail=[];
  list.forEach(x=>{
    const m=matOf(x.code);
    if(m){
      if(x.name) m.name=x.name;
      if(x.spec) m.spec=x.spec;
      if(x.unit) m.unit=x.unit;
      if(x.supplier) m.supplier=x.supplier;
      if(x.safe!==undefined) m.safe=x.safe;
      if(x.isKey!==undefined) m.isKey=x.isKey;
      // 数量：导入值优先覆盖（库存盘点以最新为准）
      m.qLine=num(x.qLine); m.qWs=num(x.qWs); m.qRaw=num(x.qRaw);
      m.updatedAt=new Date().toLocaleString('zh-CN'); m.updatedBy=whoAmI();
      m.hist=m.hist||[];
      m.hist.push({t:new Date().toLocaleString('zh-CN'),f:'导入盘点',v:'车间'+m.qLine+' 车间仓'+m.qWs+' 原料仓'+m.qRaw,u:whoAmI()});
      upd++; detail.push(['刷新',x.code,x.name||'',x.spec||'',m.qLine+'/'+m.qWs+'/'+m.qRaw]);
    }else{
      S.materials.push(Object.assign({hist:[]},x,{updatedAt:new Date().toLocaleString('zh-CN'),updatedBy:whoAmI()}));
      add++; detail.push(['新增',x.code,x.name||'',x.spec||'',num(x.qLine)+'/'+num(x.qWs)+'/'+num(x.qRaw)]);
    }
  });
  save(); render();

function dl(name,content,type){
  const b=new Blob([content],{type:type||'application/octet-stream'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(b); a.download=name;
  a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),2000);
}
function exportJSON(){
  if(!canCfg()){ toast('仅超级管理员可导出数据备份','err'); return; }
  const nm='生产订单备份_'+verLabel()+'_'+today()+'.json';
  if(encOn() && encPass()){
    encObj(S).then(p=>{
      dl(nm.replace('.json','_加密.json'), JSON.stringify(p), 'application/json');
      toast('已导出加密备份（需口令才能导入）🔐','ok');
    }).catch(e=>{
      dl(nm, JSON.stringify(S,null,1),'application/json');
      toast('加密失败，已导出明文备份','err');
    });
    return;
  }
  dl(nm, JSON.stringify(S,null,1), 'application/json');
}

function canExport(){

function exportCSV(mode){
  if(!canExport()){ toast('数据导出仅超级管理员可用','err'); return; }
  if(typeof XLSX==='undefined'){ toast('Excel组件未加载成功（可能断网或CDN被墙），请用「💾 备份数据」导出JSON','err'); return; }
  let rows,head;
  if(mode===1){ head=['订单号','产品编码','产品名称','工段','下达','车间仓','成品仓','完成','缺口','要求交付'];
    rows=S.orders.filter(o=>doneQty(o)<num(o.qty)&&num(o.qty)>0)
      .map(o=>[o.no,o.code,o.name,o.section,num(o.qty),num(o.workshop),num(o.finished),doneQty(o),num(o.qty)-doneQty(o),o.dueDate]); }
  else if(mode===2){ // 按料号汇总
    const g={}; S.orders.forEach(o=>{ const k=o.code; g[k]=g[k]||{n:0,q:0,w:0,f:0,sp:0,wip:0,name:o.name,secs:[]};
      const v=g[k]; v.n++; v.q+=num(o.qty); v.w+=num(o.workshop); v.f+=num(o.finished);
      v.sp+=num(o.shipped); v.wip+=wipOf(o);
      const sc2=o.section||'其他'; if(v.secs.indexOf(sc2)<0) v.secs.push(sc2); });
    head=['料号','产品名称','工段','工单数','下单数量','在制数量','车间仓','成品仓','发货数量','完成总数','缺口','达成率'];
    rows=Object.entries(g).sort((a,b)=>b[1].q-a[1].q).map(([k,v])=>{
      const d=v.w+v.f+v.sp; return [k,v.name,(v.secs||[]).join(' / '),v.n,v.q,v.wip,v.w,v.f,v.sp,d,v.q-d,(v.q?Math.round(d/v.q*100):0)+'%'];}); }
  else if(mode===6){ // 待定订单
    head=['订单号','产品编码','产品名称','工段','下达','要求交付','来源','备注'];
    rows=pendList().map(o=>[o.no,o.code,o.name,o.section,num(o.qty),o.dueDate||'',o.src||'',o.note||'']); }
  else if(mode===5){ // 整机数量对账
    head=['订单号','料号','产品名称','工段','开单','未开工','车间在制','车间仓','成品仓','已发货','五档合计','差异','核对'];
    rows=actList().map(o=>{ const x=balOf(o);
      return [o.no,o.code,o.name,o.section,x.q,x.open,x.wip,x.ws,x.fin,x.ship,x.sum,x.diff,
        x.diff===0?'相符':'需核对']; }); }
  else if(mode===4){ // 原材料库存
    head=['关键','料号','名称','规格','单位','供应商','车间在线','车间仓','原料仓','合计','安全库存','缺口','风险','更新时间','更新人'];
    rows=(S.materials||[]).slice().sort((a,b)=>{
      const ka=isKeyMat(a)?0:1,kb=isKeyMat(b)?0:1; if(ka!==kb) return ka-kb;
      return riskRank(a)-riskRank(b);
    }).map(m=>{ const t=matTotal(m),sf=num(m.safe);
      return [isKeyMat(m)?'⭐':'',m.code,m.name||'',m.spec||'',m.unit||'',m.supplier||'',
        num(m.qLine),num(m.qWs),num(m.qRaw),t,sf,Math.max(0,sf-t),
        RISK_TXT[matRisk(m)],m.updatedAt||'',m.updatedBy||'']; }); }
  else if(mode===3){ // 进度跟踪（含工序）
    head=['工段','订单号','产品编码','产品名称','下达'].concat(allSteps())
        .concat(['车间仓','成品仓','仓库现存','已发货','发货日期','完成','进度中','缺口','当前工序','要求交付','完成日期','状态']);
    rows=[];
    const push=o=>{ rows.push([o.section||'其他',o.no,o.code,o.name,num(o.qty)]
      .concat(allSteps().map(st=>num(o.steps?.[st])||''))
      .concat([num(o.workshop),num(o.finished),stockQty(o),num(o.shipped),o.shipDate,
        doneQty(o),wipOf(o),num(o.qty)-doneQty(o),
        curStep(o),o.dueDate,o.doneDate,statusOf(o)[0].replace(/<[^>]+>/g,'')])); };
    ['焊接','组装','包装'].forEach(sec=>S.orders.filter(o=>o.section===sec).forEach(push));
    S.orders.filter(o=>!['焊接','组装','包装'].includes(o.section)).forEach(push); }
  else { head=['订单编号','开单日期','要求交付','产品编码','产品名称','单位','工段','下达数量','车间仓','成品仓','完成数量','未完成','已发货','仓库现存','发货日期','完成日期','备注'];
    rows=S.orders.map(o=>[o.no,o.orderDate,o.dueDate,o.code,o.name,o.unit,o.section,num(o.qty),
      num(o.workshop),num(o.finished),doneQty(o),num(o.qty)-doneQty(o),
      num(o.shipped),stockQty(o),o.shipDate,o.doneDate,o.note]); }
  const ws=XLSX.utils.aoa_to_sheet([head,...rows]); const wb=XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb,ws,'导出'); XLSX.writeFile(wb,'生产订单导出_'+today()+'.xlsx');
  toast('已导出Excel','ok');
}

function recalcFlow(){
  if(!canEdit()){ toast('请先登录管理员账号','err'); return; }   // 管理员可用，超管当然也可以
  if(!confirm('将按「流转口径」整理全部订单的工序数据：\n\n'
    +'· 只保留最后一道有数量的工序\n'
    +'· 它前面的所有工序清零（表示已全部流走）\n\n'
    +'例如：焊接15、灌胶15 → 焊接0、灌胶15\n\n'
    +'此操作会修改数据且不可撤销，建议先导出备份。确定继续？')) return;
  let n=0;
  S.orders.forEach(o=>{
    o.steps=o.steps||{};
    // 只处理有数量的工序，按工艺路线排序
    const ks=Object.keys(o.steps).filter(x=>num(o.steps[x])>0)
      .sort((a,b)=>FULL_ORDER.indexOf(a)-FULL_ORDER.indexOf(b));
    if(ks.length<2) return;
    // 逐级相减：存量[i] = 累计[i] - 累计[i+1]；最后一道 = 它自己的累计
    const nv={};
    ks.forEach((x,i)=>{
      const nxt=(i+1<ks.length)?num(o.steps[ks[i+1]]):0;
      nv[x]=Math.max(0, num(o.steps[x])-nxt);
    });
    let chg=false;
    ks.forEach(x=>{ if(num(o.steps[x])!==nv[x]){ o.steps[x]=nv[x]; chg=true; } });
    if(chg){
      n++; o.hist=o.hist||[];
      o.hist.push({t:new Date().toLocaleString('zh-CN'),f:'按流转口径整理',
        v:ks.map(x=>x+':'+nv[x]).join('，'),u:whoAmI()});
    }
  });
  save(); openSet(); toast('已按流转口径整理 '+n+' 张订单','ok');
}

/* 归一化云端地址：容忍用户粘进来的各种形式
   ① 带尾斜杠       https://x.supabase.co/
   ② 带 /rest/v1...  https://x.supabase.co/rest/v1/prod_orders
   ③ 带空格/换行
   统一成            https://x.supabase.co */
function normUrl(u){
  let x=String(u||'').trim().replace(/\s+/g,'');
  x=x.replace(/\/+$/,'');                       // 去尾斜杠
  const i=x.indexOf('/rest/v1');
  if(i>0) x=x.slice(0,i);                        // 去掉 /rest/v1 及其后面
  return x;
}
function api(){
  const m=S.meta||{};
  // 本地没配（旧数据 / 从没配过 / 被误清空）时，自动回退到内置配置，保证任何设备都能连
  const url=normUrl(m.syncUrl||BUILTIN_SYNC.url);
  const key=String(m.syncKey||BUILTIN_SYNC.key||'').trim();
  if(!url||!key) return null;
  const table=String(m.syncTable||BUILTIN_SYNC.table||'').trim()||'prod_orders';  // 空了会 PGRST125
  const id=String(m.syncId||BUILTIN_SYNC.id||'').trim()||'main';
  return { url:url+'/rest/v1/'+table, key:key, id:id, table:table, base:url };
}

/* 连接自检：把真实报错翻成中文，方便排查 */
async function testConn(){
  if(!canCfg()){ toast('仅超级管理员可操作','err'); return; }
  const a=api();
  if(!a){ toast('请先填写「项目URL」和「Key」','err'); return; }
  const tip=$('#syncTip'); if(tip) tip.textContent='正在测试…';
  try{
    const r=await fetch(a.url+'?id=eq.'+encodeURIComponent(a.id)+'&select=id,updated_at',
      {headers:{'apikey':a.key,'Authorization':'Bearer '+a.key}});
    if(r.ok){ const j=await r.json();
      toast('✅ 连接成功！表 '+a.table+' 可访问'+(j.length?('，云端已有数据（更新于 '+j[0].updated_at+'）'):'，云端暂无数据，点「上传到云端」'),'ok');
      if(tip) tip.textContent='✅ 连接正常 '+new Date().toLocaleTimeString('zh-CN'); return; }
    const t=await r.text();
    let msg=t;
    if(/PGRST125|Invalid path/i.test(t)) msg='地址拼出来不合法（表名可能为空）。请确认表名填的是 prod_orders';
    else if(/42P01|relation .* does not exist|PGRST205/i.test(t)) msg='表 '+a.table+' 不存在！请到 Supabase 的 SQL Editor 执行建表 SQL';
    else if(/No policy rule matched|42501|permission denied/i.test(t))
      msg='表已建好，但访问策略未生效（403）。请到 Supabase 的 SQL Editor 重新执行一次建表 SQL 中的「drop policy + create policy」部分';
    else if(/403/i.test(t)) msg='无访问权限（403）：请确认已执行建表 SQL 里的策略（policy）部分';
    else if(/401|JWT|Invalid API key/i.test(t)) msg='Key 不对或已失效：请复制 publishable key 或 anon key（不要复制 secret/service_role）';
    else if(/permission denied|42501/i.test(t)) msg='权限不足：请确认已执行建表 SQL 里的策略（policy）部分';
    else if(/404|ENOTFOUND|Failed to fetch/i.test(t)) msg='连不上：项目URL 是否正确？网络能否访问 supabase.co？';
    toast('❌ '+msg,'err'); if(tip) tip.textContent='❌ '+msg;
  }catch(e){
    const m2=/Failed to fetch|NetworkError/i.test(String(e.message))?'连不上服务器：检查项目URL 是否正确、网络能否访问 supabase.co':'异常：'+e.message;
    toast('❌ '+m2,'err'); if(tip) tip.textContent='❌ '+m2;
  }
}
async function cloudPush(silent){
  if(!silent && !canCfg()){ toast('云同步仅超级管理员可用','err'); return; }
  const a=api(); if(!a){ if(!silent) toast('请先填写云端地址与Key','err'); return; }
  // ★ 已启用加密但本机缺口令：禁止上传，避免把云端密文覆盖成明文
  if(encOn() && !encPass()){
    if(!silent){ toast('已启用加密但本机没有口令，已阻止上传（防止覆盖云端密文）','err');
      askEncPass('请输入数据口令后重新上传。'); }
    return;
  }
  try{
    // 上传前先把云端已有的账号并进来，避免本机数据把别人的账号覆盖掉
    // 云端若是密文：本机有口令就解密后合并；没口令则跳过（不能因此中断上传）
    try{
      const g=await fetch(a.url+'?id=eq.'+encodeURIComponent(a.id)+'&select=data',
        {headers:{'apikey':a.key,'Authorization':'Bearer '+a.key}});
      if(g.ok){ const cj=await g.json();
        let cd=cj&&cj[0]&&cj[0].data;
        if(isEnc(cd)){ try{ cd=await decObj(cd); }catch(e){ cd=null; } }
        const cu=cd&&cd.meta&&cd.meta.users;
        if(cu&&cu.length) S.meta.users=mergeUsers(S.meta.users||[], cu); }
    }catch(e){ /* 取不到就按本地上传，不影响主流程 */ }
    // ★ 加密：启用加密且本机有口令时，上传密文（云端只存密文）
    let payload=S;
    if(encOn() && encPass()){
      try{ payload=await encObj(S); }
      catch(e){ if(!silent) toast('加密失败，已按明文上传：'+e.message,'err'); payload=S; }
    }
    const r=await fetch(a.url,{method:'POST',headers:{'apikey':a.key,'Authorization':'Bearer '+a.key,
      'Content-Type':'application/json','Prefer':'resolution=merge-duplicates,return=minimal'},
      body:JSON.stringify({id:a.id,data:payload,updated_at:new Date().toISOString()})});
    if(!r.ok) throw new Error(await r.text());
    S.meta.cloudAt=new Date().toISOString();
    if(typeof renderSyncBadge==='function') renderSyncBadge();
    if(!silent) toast(isEnc(payload)?'已加密上传到云端 🔐':'已上传到云端','ok');
    if($('#syncTip')) $('#syncTip').textContent='已上传 '+new Date().toLocaleTimeString('zh-CN');
  }catch(e){ if(!silent) toast('上传失败：'+e.message,'err'); }
}
/* 启动时静默从云端同步：不弹窗、不校验权限、失败静默降级用本地数据。
   只在「云端比本地新」或「本地为空」时覆盖，避免吃掉本地未上传的改动。 */
async function autoSync(){
  const a=api(); if(!a) return false;
  try{
    const r=await fetch(a.url+'?id=eq.'+encodeURIComponent(a.id)+'&select=data,updated_at',
      {headers:{'apikey':a.key,'Authorization':'Bearer '+a.key}});
    if(!r.ok) return false;
    const j=await r.json();
    if(!j.length||!j[0]||!j[0].data) return false;
    let d=j[0].data;
    // ★ 云端是密文：有口令就解密，没口令静默跳过（不打断启动/轮询）
    if(isEnc(d)){
      if(!encPass()) return false;
      try{ d=await decObj(d); }catch(e){ return false; }
    }
    if(!d||!d.orders||!d.orders.length) return false;
    const localN=S.orders.length;
    const cloudN=d.orders.length;
    const cloudT=j[0].updated_at||'';
    const localT=S.meta.cloudAt||'';
    // 本地为空（新设备）→ 无条件用云端；否则只在云端更新时覆盖
    const should = (localN===0) || (cloudT && (!localT || cloudT>localT));
    if(!should){
      if(cloudN>localN && cloudT===localT){
        // 时间相同但云端条数更多，也采用云端
      } else { return false; }
    }
    const localUsers=((S.meta&&S.meta.users)||[]).slice();
    S=Object.assign({products:[],orders:[],meta:{}},d);
    if(!S.meta) S.meta={};
    S.meta.users=mergeUsers(S.meta.users||[], localUsers);   // 账号永不丢失
    S.meta.syncUrl=a.url.split('/rest/v1')[0];
    S.meta.cloudAt=cloudT||new Date().toISOString();
    try{ localStorage.setItem(LS,JSON.stringify(S)); }catch(e){}
    renderNav(); renderVerBadge(); render();
    // 只有真的从云端拿到了不同数据才提示，避免每次打开都弹「已同步 N 条」
    if(S.orders.length!==localN || String(cloudT)!==String(localT)){
      toast('已从云端同步 '+S.orders.length+' 条订单','ok');
    }
    return true;
  }catch(e){ return false; }   // 断网/失败：静默用本地
}
async function cloudPull(){
  if(!canCfg()){ toast('云同步仅超级管理员可用','err'); return; }
  const a=api(); if(!a){ toast('请先填写云端地址与Key','err'); return; }
  try{
    const r=await fetch(a.url+'?id=eq.'+encodeURIComponent(a.id)+'&select=data,updated_at',
      {headers:{'apikey':a.key,'Authorization':'Bearer '+a.key}});
    if(!r.ok) throw new Error(await r.text());
    const j=await r.json();
    if(!j.length){ toast('云端还没有数据，先点「上传到云端」','err'); return; }
    let d=j[0].data;
    // ★ 密文：用本机口令解密；没口令就弹框索取
    if(isEnc(d)){
      if(!encPass()){ askEncPass('云端数据是加密的，请输入数据口令后重试。'); return; }
      try{ d=await decObj(d); }
      catch(e){ toast(e.message,'err'); askEncPass('口令不对，请重新输入。'); return; }
    }
    if(!confirm('云端数据：'+(d.orders||[]).length+' 条订单，更新于 '+j[0].updated_at+'。用它覆盖本地？')) return;
    const lu=((S.meta&&S.meta.users)||[]).slice();
    S=Object.assign({products:[],orders:[],meta:{}},d); if(!S.meta) S.meta={};
    S.meta.users=mergeUsers(S.meta.users||[], lu);
    S.meta.syncUrl=a.url.split('/rest/v1')[0]; save(); closeM(); render(); toast('已从云端拉取','ok');
  }catch(e){ toast('拉取失败：'+e.message,'err'); }
}
function openM(){ $('#mask').classList.add('on'); }
function closeM(){ $('#mask').classList.remove('on'); }
$('#mask').addEventListener('click',e=>{ if(e.target.id==='mask') closeM(); });

  const dd=$('#p-dash'); if(dd) dd.classList.add('on');
}
